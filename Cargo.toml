[package]
name = "streamrs"
version = "0.8.4"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
chrono = "0.4.45"
crc32fast = "1.5"
enigo = { version = "0.6.1", default-features = false, features = ["wayland", "x11rb"] }
futures-channel = "0.3.34"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_4"] }
hidapi = "2.6.7"
libc = "0.2"
image = "0.25.10"
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.2.1"
xkeysym = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[profile.release]
strip = true
